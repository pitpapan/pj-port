CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y

# Stage 5 PJLIB platform baseline.
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_PICOLIBC=y
CONFIG_POSIX_API=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=5
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192

# POSIX/BSD facilities used by the selected socket, resolver, and ioqueue
# implementations. Runtime network validation remains deferred to Stage 9.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_PJPROJECT=y
CONFIG_PJLIB=y
