# Build the Stage 5 POSIX runtime probe independently of unresolved PJLIB
# platform adaptations. This does not alter the normal PJLIB configuration.
CONFIG_PJLIB=n
CONFIG_PJLIB_STAGE5_PROBE=y
CONFIG_HEAP_MEM_POOL_SIZE=65536

# QEMU capability probing only; never use this provider for production GUIDs,
# hashes, security, or network sequence numbers.
CONFIG_TEST_RANDOM_GENERATOR=y

# No external SLIP peer is needed for the synchronization/time probes.
CONFIG_NET_QEMU_SLIP=n
CONFIG_NET_SLIP_TAP=n
CONFIG_SLIP=n
