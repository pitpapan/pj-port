# Stage 10 validates PJLIB's select-backed ioqueue on Zephyr loopback.
CONFIG_PJLIB_STAGE10_TEST=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_NET_LOOPBACK=y

# The PJLIB port configures PJ_IOQUEUE_MAX_HANDLES=32. Raise the platform
# resource ceilings above that value so the maximum-handle test reaches the
# PJLIB ioqueue limit rather than a lower Zephyr socket/descriptor limit.
CONFIG_NET_MAX_CONTEXTS=40
CONFIG_NET_MAX_CONN=40
CONFIG_ZVFS_OPEN_MAX=48
CONFIG_ZVFS_POLL_MAX=40

# Stage 10 creates three PJLIB polling threads over the whole run.
CONFIG_DYNAMIC_THREAD_POOL_SIZE=8
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_MAX_PTHREAD_MUTEX_COUNT=48
