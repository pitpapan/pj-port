# Stage 8 adds repeated core-runtime validation to the Stage 7 application.
CONFIG_PJLIB_STAGE8_TEST=y

# The main test coordinator and the repeated POSIX thread creations need
# explicit capacity on this target. PJLIB passes requested stack size to
# pthreads and does not allocate or free raw stack buffers from PJLIB pools.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_POOL_SIZE=48
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=131072
