CONFIG_CPP=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_DNS_RESOLVER=y

# Starts net_config_init() at boot, which is what actually calls
# net_dhcpv4_start() on the interface. Without this, CONFIG_NET_DHCPV4=y
# alone never starts the DHCP client and the interface stays at 0.0.0.0.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

CONFIG_MQTT_LIB=y
CONFIG_MQTT_VERSION_5_0=y

# mps2/an385 has no hardware entropy source; the net stack (TCP ISN/ports,
# DHCP timing, MQTT message IDs) needs sys_rand_get() to link against something.
CONFIG_TEST_RANDOM_GENERATOR=y

# QEMU user-mode networking (SLIRP): reaches the host without needing a TAP
# device / root permissions. The host is visible to the guest as 10.0.2.2.
CONFIG_NET_QEMU_USER=y

CONFIG_LOG=y
CONFIG_PRINTK=y
