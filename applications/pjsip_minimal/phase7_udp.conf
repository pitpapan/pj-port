# Phase 7 validates PJSIP over deterministic Zephyr IPv4 UDP loopback.
CONFIG_PJLIB_UTIL=y
CONFIG_PJSIP=y
CONFIG_PJSIP_UDP_TRANSPORT=y
CONFIG_PJSIP_TCP_TRANSPORT=n
CONFIG_PJSIP_PHASE4_TEST=n
CONFIG_PJSIP_PHASE5_TEST=n
CONFIG_PJSIP_PHASE6_TEST=n
CONFIG_PJSIP_PHASE7_TEST=y
CONFIG_PJSIP_PHASE8_TEST=n

CONFIG_NET_IPV6=n
CONFIG_NET_LOOPBACK=y

# Keep the platform socket and descriptor ceilings above the endpoint's
# configured PJSIP_MAX_TRANSPORTS=16 limit so overflow is reported by PJLIB.
CONFIG_NET_MAX_CONTEXTS=40
CONFIG_NET_MAX_CONN=40
CONFIG_ZVFS_OPEN_MAX=48
CONFIG_ZVFS_POLL_MAX=40

# The robustness test sends one datagram larger than PJSIP_MAX_PKT_LEN=4000.
# Provide enough network fragments for that datagram to traverse loopback and
# be truncated/rejected by the bounded PJSIP receive path.
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_IPV4_FRAGMENT=y
CONFIG_NET_IPV4_FRAGMENT_MAX_COUNT=4

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_DYNAMIC_THREAD_POOL_SIZE=8
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_MAX_PTHREAD_MUTEX_COUNT=48
