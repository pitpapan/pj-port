CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y

# Preserve the validated PJLIB Zephyr platform baseline while the PJSIP layers
# are introduced one component at a time.
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_PICOLIBC=y
CONFIG_POSIX_API=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=5
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_NET_QEMU_SLIP=n
CONFIG_NET_SLIP_TAP=n
CONFIG_SLIP=n

# The default application stays at the validated PJLIB-only boundary. Phase
# overlays opt into exactly one later validation boundary at a time.
CONFIG_PJPROJECT=y
CONFIG_PJLIB=y
CONFIG_PJLIB_UTIL=n
CONFIG_PJSIP=n
