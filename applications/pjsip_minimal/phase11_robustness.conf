# Phase 11 validates robustness and resource behavior for the usable IPv4
# UDP signaling profile. It uses only QEMU loopback services.
CONFIG_PJLIB_UTIL=y
CONFIG_PJLIB_UTIL_DNS_RESOLVER=y
CONFIG_PJSIP=y
CONFIG_PJSIP_REGC=y
CONFIG_PJSIP_UDP_TRANSPORT=y
CONFIG_PJSIP_TCP_TRANSPORT=n
CONFIG_PJSIP_PHASE11_TEST=y

CONFIG_NET_IPV6=n
CONFIG_NET_LOOPBACK=y

# Keep platform limits above PJSIP's tested 16-handle endpoint ceiling so the
# ioqueue, rather than an earlier Zephyr descriptor ceiling, reports overflow.
CONFIG_NET_MAX_CONTEXTS=40
CONFIG_NET_MAX_CONN=40
CONFIG_ZVFS_OPEN_MAX=48
CONFIG_ZVFS_POLL_MAX=40
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=40
CONFIG_NET_PKT_RX_COUNT=20
CONFIG_NET_PKT_TX_COUNT=20
CONFIG_NET_IPV4_FRAGMENT=y
CONFIG_NET_IPV4_FRAGMENT_MAX_COUNT=4

CONFIG_MAIN_STACK_SIZE=24576
CONFIG_HEAP_MEM_POOL_SIZE=393216
CONFIG_DYNAMIC_THREAD_POOL_SIZE=10
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64

# Required by the documented k_thread_stack_space_get() watermark API.
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_ASSERT=y
