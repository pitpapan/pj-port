# Phase 5 validates non-network PJSIP semantics and repeated endpoint teardown.
CONFIG_PJLIB_UTIL=y
CONFIG_PJSIP=y
CONFIG_PJSIP_UDP_TRANSPORT=n
CONFIG_PJSIP_TCP_TRANSPORT=n
CONFIG_PJSIP_PHASE5_TEST=y

CONFIG_NET_IPV6=n

# Retain the validated Stage 10 PJLIB capacity profile. Endpoint construction
# needs more POSIX mutex objects than Zephyr's default limit of five.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_MAX_PTHREAD_MUTEX_COUNT=48
