# Phase 10 validates the initial usable IPv4 SIP signaling profile against an
# application-local registrar. No public registrar or DNS service is used.
CONFIG_PJLIB_UTIL=y
CONFIG_PJLIB_UTIL_DNS_RESOLVER=y
CONFIG_PJSIP=y
CONFIG_PJSIP_REGC=y
CONFIG_PJSIP_UDP_TRANSPORT=y
CONFIG_PJSIP_TCP_TRANSPORT=n
CONFIG_PJSIP_PHASE10_TEST=y

CONFIG_NET_IPV6=n
CONFIG_NET_LOOPBACK=y

# Two SIP UDP transports and the endpoint ioqueue remain below these explicit
# application limits. The resolver sources are linked as part of the usable
# profile, but numeric loopback addressing keeps this test self-contained.
CONFIG_NET_MAX_CONTEXTS=40
CONFIG_NET_MAX_CONN=40
CONFIG_ZVFS_OPEN_MAX=48
CONFIG_ZVFS_POLL_MAX=40
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16

CONFIG_MAIN_STACK_SIZE=24576
CONFIG_HEAP_MEM_POOL_SIZE=393216
CONFIG_DYNAMIC_THREAD_POOL_SIZE=10
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
