# Phase 8 validates PJSIP over deterministic Zephyr IPv4 TCP loopback while
# keeping the Phase 7 UDP transport active within the same endpoint.
CONFIG_PJLIB_UTIL=y
CONFIG_PJSIP=y
CONFIG_PJSIP_UDP_TRANSPORT=y
CONFIG_PJSIP_TCP_TRANSPORT=y
CONFIG_PJSIP_PHASE4_TEST=n
CONFIG_PJSIP_PHASE5_TEST=n
CONFIG_PJSIP_PHASE6_TEST=n
CONFIG_PJSIP_PHASE7_TEST=n
CONFIG_PJSIP_PHASE8_TEST=y
CONFIG_PJSIP_PHASE9_TEST=n

CONFIG_NET_IPV6=n
CONFIG_NET_LOOPBACK=y

# Leave headroom for the TCP listener, both ends of loopback connections,
# the concurrent UDP transport, raw framing peers, and descriptor polling.
CONFIG_NET_MAX_CONTEXTS=48
CONFIG_NET_MAX_CONN=48
CONFIG_ZVFS_OPEN_MAX=56
CONFIG_ZVFS_POLL_MAX=48
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24

CONFIG_MAIN_STACK_SIZE=24576
CONFIG_HEAP_MEM_POOL_SIZE=393216
CONFIG_DYNAMIC_THREAD_POOL_SIZE=10
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
