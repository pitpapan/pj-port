# Phase 6 validates PJSIP timers, endpoint polling, loop transport, and
# transaction state machines without using Zephyr network sockets.
CONFIG_PJLIB_UTIL=y
CONFIG_PJSIP=y
CONFIG_PJSIP_UDP_TRANSPORT=n
CONFIG_PJSIP_TCP_TRANSPORT=n
CONFIG_PJSIP_PHASE6_TEST=y

CONFIG_NET_IPV6=n

# The loop transport owns one PJLIB worker and this validation owns one event
# pump. Keep the validated PJLIB thread stack and synchronization ceilings.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_DYNAMIC_THREAD_POOL_SIZE=8
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_MAX_PTHREAD_MUTEX_COUNT=48
