# Phase 3 validates only the four-source PJLIB-UTIL subset selected by the
# Phase 1 dependency analysis. PJSIP production sources remain disabled.
CONFIG_PJLIB_UTIL=y
CONFIG_PJSIP=n
CONFIG_PJSIP_PHASE3_TEST=y

# The optimized validation harness has a 2,964-byte static frame because its
# scanner canaries and character-set exhaustion test coexist. Keep additional
# headroom for PJLIB calls and printk; this is test-harness sizing, not the
# later PJSIP production-thread stack decision.
CONFIG_MAIN_STACK_SIZE=8192
