CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y

CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_PICOLIBC=y
CONFIG_POSIX_API=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=5
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192

# Retain the validated PJLIB socket/POSIX platform boundary even though Phase
# 1 does not create SIP or media sockets.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_NET_QEMU_SLIP=n
CONFIG_NET_SLIP_TAP=n
CONFIG_SLIP=n

# The independent PJMEDIA application defaults to the prior PJLIB-only
# boundary. No PJMEDIA header, source, or configuration is enabled here.
CONFIG_PJPROJECT=y
CONFIG_PJLIB=y
CONFIG_PJLIB_UTIL=n
CONFIG_PJSIP=n
CONFIG_PJMEDIA=n
